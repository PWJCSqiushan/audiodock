name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /audiodock/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t audiodock:ci .
      - name: Container readiness
        run: |
          docker run -d --name audiodock-ci -p 8787:10000 audiodock:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 2
          done
          docker logs audiodock-ci
          exit 1
